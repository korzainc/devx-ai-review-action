name: Korza AI Code Review
description: On-demand AI code review that reports a pass/fail check on the pull request.
author: Korza
branding:
  icon: eye
  color: purple

inputs:
  anthropic-api-key:
    description: Anthropic API key for the review. Always pass it from a secret.
    required: true
  github-token:
    description: Token used to read the PR and post the check run and review comments.
    required: false
    default: ${{ github.token }}
  registry-token:
    description: >
      Token used to pull the private engine image from GHCR. The default works for
      korzainc repos that have been granted read access to the package. Repos in
      other orgs must pass a read:packages token here.
    required: false
    default: ${{ github.token }}
  registry-username:
    description: Username for the GHCR login. Set it to the token owner when registry-token is a PAT.
    required: false
    default: ${{ github.actor }}
  config:
    description: Path to the review config in the consuming repo.
    required: false
    default: .korza/review.yml
  skills:
    description: Comma-separated skills to run. Empty runs every skill the config enables.
    required: false
    default: ""
  trigger-phrase:
    description: Comment text that starts a review on issue_comment events.
    required: false
    default: /review
  allowed-associations:
    description: Who may trigger a review by comment, as GitHub author associations.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  check-name:
    description: Name of the check run on the PR. Require this name in branch protection.
    required: false
    default: AI Code Review
  fail-on-error:
    description: >
      What the check reports when the review cannot complete (outage, timeout, crash).
      false reports neutral, which does not block merges. true reports failure.
    required: false
    default: "false"
  timeout-seconds:
    description: >
      Time budget for the engine, which is told this number and should enforce it.
      As a backstop the action sends the container TERM 30 seconds past it and KILL
      20 seconds after that; the check then reports per fail-on-error.
    required: false
    default: "600"
  publish-timeout-seconds:
    description: Publisher time budget in seconds (1 through 3600), plus bounded termination cleanup.
    required: false
    default: "120"
  upload-sarif:
    description: Also upload findings to GitHub code scanning (needs security-events write).
    required: false
    default: "false"
  image:
    description: Engine image, pinned by digest per release. Override only for testing.
    required: false
    default: ghcr.io/korzainc/devx-ai-review-pre-release@sha256:46a21206278aa9190fb037ec52cdb68e3d29def26522640400d0a1cd79a1eae0

outputs:
  verdict:
    description: pass, fail, error, or skipped.
    value: ${{ steps.review.outputs.verdict || 'skipped' }}
  findings:
    description: Number of findings reported.
    value: ${{ steps.review.outputs.findings }}
  sarif-file:
    description: Path to the SARIF file on the runner.
    value: ${{ steps.review.outputs.sarif-file }}
  check-run-id:
    description: ID of the check run created on the PR head commit.
    value: ${{ steps.prep.outputs.check-run-id }}
  delivery:
    description: success after a verified summary-comment receipt, error on failed delivery, or skipped when publishing did not run.
    value: ${{ steps.publish.outputs.delivery || 'skipped' }}
  summary-url:
    description: Verified summary comment URL when delivery succeeded.
    value: ${{ steps.publish.outputs.summary-url }}

runs:
  using: composite
  steps:
    - name: Prepare
      id: prep
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
        ALLOWED_ASSOCIATIONS: ${{ inputs.allowed-associations }}
        CHECK_NAME: ${{ inputs.check-name }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare.sh"

    - name: Log in to GHCR
      if: steps.prep.outputs.run == 'true'
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin

    - name: Review
      id: review
      if: steps.prep.outputs.run == 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        REVIEW_IMAGE: ${{ inputs.image }}
        REVIEW_CONFIG: ${{ inputs.config }}
        REVIEW_SKILLS: ${{ inputs.skills }}
        REVIEW_TIMEOUT: ${{ inputs.timeout-seconds }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        BASE_SHA: ${{ steps.prep.outputs.base-sha }}
        HEAD_SHA: ${{ steps.prep.outputs.head-sha }}
        CHECK_RUN_ID: ${{ steps.prep.outputs.check-run-id }}
        ENGINE_CONTAINER: ${{ steps.prep.outputs.engine-container }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"

    # A cancelled job kills run.sh outright, so its own cleanup never runs and
    # the engine container outlives the docker client. On a persistent
    # self-hosted runner it would keep running, and spending the API key.
    # The name comes from prep, so it is known even if run.sh never wrote outputs.
    - name: Clean up review container
      if: always() && steps.prep.outputs.engine-container != ''
      shell: bash
      env:
        ENGINE_CONTAINER: ${{ steps.prep.outputs.engine-container }}
      run: timeout --signal=TERM --kill-after=5 10 docker rm -f "$ENGINE_CONTAINER" > /dev/null 2>&1 || true

    - name: Publish review
      id: publish
      if: always() && !cancelled() && steps.review.outputs.review-completed == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PUBLISH_TIMEOUT: ${{ inputs.publish-timeout-seconds }}
        REVIEW_IMAGE: ${{ inputs.image }}
        OUTPUT_DIR: ${{ steps.review.outputs.output-dir }}
        REVIEW_COMPLETION_FILE: ${{ steps.review.outputs.completion-file }}
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        BASE_SHA: ${{ steps.prep.outputs.base-sha }}
        HEAD_SHA: ${{ steps.prep.outputs.head-sha }}
      run: bash "$GITHUB_ACTION_PATH/scripts/publish.sh"

    - name: Clean up publisher container
      if: always() && steps.publish.outputs.publisher-container != ''
      shell: bash
      env:
        PUBLISHER_CONTAINER: ${{ steps.publish.outputs.publisher-container }}
      run: timeout --signal=TERM --kill-after=5 10 docker rm -f "$PUBLISHER_CONTAINER" > /dev/null 2>&1 || true

    - name: Complete check
      if: always() && steps.prep.outputs.check-run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CHECK_RUN_ID: ${{ steps.prep.outputs.check-run-id }}
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
        VERDICT: ${{ steps.review.outputs.verdict }}
        REVIEW_COMPLETED: ${{ steps.review.outputs.review-completed }}
        JOB_CANCELLED: ${{ job.status == 'cancelled' }}
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        DELIVERY: ${{ steps.publish.outputs.delivery }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        SUMMARY_FILE: ${{ steps.review.outputs.summary-file }}
        RESULT_FILE: ${{ steps.review.outputs.result-file }}
        BLOCKING_PROCESS_FAILURE: ${{ steps.review.outputs.blocking-process-failure }}
      run: bash "$GITHUB_ACTION_PATH/scripts/finalize.sh"

    - name: Log out of GHCR
      if: always() && steps.prep.outputs.run == 'true'
      shell: bash
      run: docker logout ghcr.io >/dev/null 2>&1 || true

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.review.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.review.outputs.sarif-file }}
        category: korza-ai-review

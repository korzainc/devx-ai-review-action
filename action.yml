name: Korza AI Code Review
description: On-demand AI code review that reports a pass/fail check on the pull request.
author: Korza
branding:
  icon: eye
  color: purple

inputs:
  anthropic-api-key:
    description: >
      Anthropic API key, from a secret. Used (Haiku 5.5) when no openai-api-key is set, or when
      provider is anthropic.
    required: false
    default: ""
  openai-api-key:
    description: >
      The repository's own OpenAI API key, from a secret. Used first when set (GPT-6 Luna).
    required: false
    default: ""
  org-openai-api-key:
    description: >
      The org-level OpenAI key (secret KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY). Used only
      when neither openai-api-key nor anthropic-api-key is set. It has its own name because a
      workflow can't tell a repository secret from an org secret of the same name.
    required: false
    default: ""
  provider:
    description: >
      Force the model provider, anthropic or openai. Empty (the default) picks by key: the
      repository's OpenAI key, then its Anthropic key, then the org-level OpenAI key.
    required: false
    default: ""
  github-token:
    description: Token used to read the PR and post the check run and review comments.
    required: false
    default: ${{ github.token }}
  registry-token:
    description: >
      Token used to pull the private engine image from GHCR. The default works for
      korzainc repos that have been granted read access to the package. Repos in
      other orgs must pass a read:packages token here.
    required: false
    default: ${{ github.token }}
  registry-username:
    description: Username for the GHCR login. Set it to the token owner when registry-token is a PAT.
    required: false
    default: ${{ github.actor }}
  config:
    description: Path to the review config in the consuming repo.
    required: false
    default: .korza/review.yml
  skills:
    description: Comma-separated skills to run. Empty runs every skill the config enables.
    required: false
    default: ""
  trigger-phrase:
    description: Comment text that starts a review on issue_comment events.
    required: false
    default: /review
  allowed-associations:
    description: Who may trigger a review by comment, as GitHub author associations.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  check-name:
    description: Name of the check run on the PR. Require this name in branch protection.
    required: false
    default: AI Code Review
  fail-on-error:
    description: >
      What the check reports when the review cannot complete (outage, timeout, crash).
      false reports neutral, which does not block merges. true reports failure.
    required: false
    default: "false"
  timeout-seconds:
    description: >
      Time budget for the engine, which is told this number and should enforce it.
      As a backstop the action sends the container TERM 30 seconds past it and KILL
      20 seconds after that; the check then reports per fail-on-error.
    required: false
    default: "600"
  publish-timeout-seconds:
    description: >
      Hard outer publisher timeout in seconds (1 through 3600), including container startup,
      plus bounded termination cleanup. Passed unchanged to the engine, which reserves its
      own shutdown margin. Allow for engine pacing and waiting (up to 240s by default).
      Does not guarantee a summary or receipt under GitHub failures.
    required: false
    default: "360"
  upload-sarif:
    description: Also upload findings to GitHub code scanning (needs security-events write).
    required: false
    default: "false"
  upload-debug:
    description: >
      Keep review-stage logs, model calls, findings and inputs as a workflow artifact
      for up to 14 days. Raw source and model text may contain sensitive content. No checkout,
      environment files or credential files are deliberately attached. Publisher run files
      are not included; normal console output remains in workflow logs. "auto" (the
      default) uploads only when the repository running the review is private; "true" or
      "false" forces it on or off.
    required: false
    default: "auto"  # auto = upload only from private repositories; "true"/"false" force it
  auto-republish:
    description: >
      Opt in to posting findings GitHub's rate limit left unposted by dispatching this same
      workflow again, with no model call and no comment from the author. Off by default: it
      needs actions:write to dispatch, actions:read to download the earlier run's handoff, and
      a workflow_dispatch block with the inputs in the README. It is also unavailable on a
      public repository, because the handoff carries findings the review dropped and never
      posted. Left off, deferred findings wait for the next review of the pull request.
    required: false
    default: "false"
  max-republish-attempts:
    description: >
      How many times in a row a run may dispatch a follow-up. Each dispatch carries the count,
      so a pull request that keeps hitting the limit stops instead of dispatching forever.
    required: false
    default: "3"
  republish-pr-number:
    description: >
      Set by the dispatch, not by hand. The pull request to post to. A workflow_dispatch has no
      pull request of its own, so the dispatch names it.
    required: false
    default: ""
  republish-source-run-id:
    description: >
      Set by the dispatch, not by hand. The run whose handoff artifact holds the findings to
      post. When set, this run publishes that handoff and never reviews.
    required: false
    default: ""
  republish-source-run-attempt:
    description: Set by the dispatch, not by hand. That run's attempt, which keys its artifact.
    required: false
    default: ""
  republish-attempt:
    description: Set by the dispatch, not by hand. Which follow-up this is, counting from 1.
    required: false
    default: ""
  image:
    description: Engine image, pinned by digest per release. Override only for testing.
    required: false
    default: ghcr.io/korzainc/devx-ai-review:0.1.1@sha256:19a35a4d672ba12b96e5ccd1a376f3d0899ff54430a7303cccf63c34598dafcf

outputs:
  verdict:
    description: pass, fail, error, or skipped.
    value: ${{ steps.review.outputs.verdict || 'skipped' }}
  findings:
    description: Number of findings reported.
    value: ${{ steps.review.outputs.findings }}
  sarif-file:
    description: Path to the SARIF file on the runner.
    value: ${{ steps.review.outputs.sarif-file }}
  check-run-id:
    description: ID of the check run created on the PR head commit.
    value: ${{ steps.prep.outputs.check-run-id }}
  delivery:
    description: success after a verified summary-comment receipt, error on failed or unverified delivery, not-started when publishing failed before the publisher ran, or skipped when publishing did not run.
    value: ${{ steps.publish.outputs.delivery || 'skipped' }}
  summary-url:
    description: Verified summary comment URL when delivery succeeded.
    value: ${{ steps.publish.outputs.summary-url }}

runs:
  using: composite
  steps:
    - name: Prepare
      id: prep
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
        ALLOWED_ASSOCIATIONS: ${{ inputs.allowed-associations }}
        CHECK_NAME: ${{ inputs.check-name }}
        REPUBLISH_PR_NUMBER: ${{ inputs.republish-pr-number }}
        REPUBLISH_SOURCE_RUN_ID: ${{ inputs.republish-source-run-id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare.sh"

    # A run id says nothing about what produced the handoff, so check the run before its
    # bytes are downloaded at all.
    - name: Check the handoff's source run
      if: steps.prep.outputs.republish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_RUN_ID: ${{ inputs.republish-source-run-id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check_source_run.sh"

    # The earlier run's handoff, not this one's: a republish reviews nothing.
    - name: Download the deferred findings
      if: steps.prep.outputs.republish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ai-review-handoff-pr${{ steps.prep.outputs.pr-number }}-${{ inputs.republish-source-run-id }}-${{ inputs.republish-source-run-attempt }}
        path: ${{ runner.temp }}/korza-republish
        run-id: ${{ inputs.republish-source-run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Attest the deferred findings
      id: republish
      if: steps.prep.outputs.republish == 'true'
      shell: bash
      run: |
        env -i PATH="$PATH" python3 -I "$GITHUB_ACTION_PATH/scripts/contract.py" attest-republish \
          --artifact-dir "$RUNNER_TEMP/korza-republish" \
          --control-dir "$RUNNER_TEMP/korza-republish-control" \
          --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" --image "$REVIEW_IMAGE" \
          --source-run-id "$SOURCE_RUN_ID" \
          --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
          >> "$GITHUB_OUTPUT"
      env:
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        REVIEW_IMAGE: ${{ inputs.image }}
        SOURCE_RUN_ID: ${{ inputs.republish-source-run-id }}

    - name: Log in to GHCR
      if: steps.prep.outputs.run == 'true'
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin

    - name: Review
      id: review
      if: steps.prep.outputs.run == 'true' && steps.prep.outputs.republish != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY: ${{ inputs.org-openai-api-key }}
        REVIEW_PROVIDER: ${{ inputs.provider }}
        REVIEW_IMAGE: ${{ inputs.image }}
        REVIEW_CONFIG: ${{ inputs.config }}
        REVIEW_SKILLS: ${{ inputs.skills }}
        REVIEW_TIMEOUT: ${{ inputs.timeout-seconds }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        BASE_SHA: ${{ steps.prep.outputs.base-sha }}
        HEAD_SHA: ${{ steps.prep.outputs.head-sha }}
        CHECK_RUN_ID: ${{ steps.prep.outputs.check-run-id }}
        ENGINE_CONTAINER: ${{ steps.prep.outputs.engine-container }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"

    # A cancelled job kills run.sh outright, so its own cleanup never runs and
    # the engine container outlives the docker client. On a persistent
    # self-hosted runner it would keep running, and spending the API key.
    # The name comes from prep, so it is known even if run.sh never wrote outputs.
    - name: Clean up review container
      if: always() && steps.prep.outputs.engine-container != ''
      shell: bash
      env:
        ENGINE_CONTAINER: ${{ steps.prep.outputs.engine-container }}
      run: timeout --signal=TERM --kill-after=5 10 docker rm -f "$ENGINE_CONTAINER" > /dev/null 2>&1 || true

    # Either this run's review or an earlier one's, re-attested to this run. Both arms are an
    # attested completion; neither publishes without one.
    - name: Publish review
      id: publish
      if: always() && !cancelled() && (steps.review.outputs.review-completed == 'true' || steps.republish.outputs.completion-file != '')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PUBLISH_TIMEOUT: ${{ inputs.publish-timeout-seconds }}
        REVIEW_IMAGE: ${{ inputs.image }}
        OUTPUT_DIR: ${{ steps.republish.outputs.output-dir || steps.review.outputs.output-dir }}
        REVIEW_COMPLETION_FILE: ${{ steps.republish.outputs.completion-file || steps.review.outputs.completion-file }}
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        BASE_SHA: ${{ steps.republish.outputs.merge-base-sha || steps.prep.outputs.base-sha }}
        HEAD_SHA: ${{ steps.republish.outputs.head-sha || steps.prep.outputs.head-sha }}
        # True only while a follow-up is still allowed to run. On the last attempt nothing
        # more will be dispatched, so the summary must ask the author instead of promising.
        # The bound here and MAX_ATTEMPTS in dispatch_republish.sh must agree, and like the
        # dispatch it holds only in a private repository.
        PUBLISH_FOLLOWUP: ${{ inputs.auto-republish == 'true' && github.event.repository.private && fromJSON(inputs.republish-attempt || '0') < fromJSON(inputs.max-republish-attempts) }}
      run: bash "$GITHUB_ACTION_PATH/scripts/publish.sh"

    - name: Clean up publisher container
      if: always() && steps.publish.outputs.publisher-container != ''
      shell: bash
      env:
        PUBLISHER_CONTAINER: ${{ steps.publish.outputs.publisher-container }}
      run: timeout --signal=TERM --kill-after=5 10 docker rm -f "$PUBLISHER_CONTAINER" > /dev/null 2>&1 || true

    # Only when something is actually owed, and never from a public repository: the handoff
    # carries findings the review dropped, which are never posted. Until the engine emits a
    # redacted handoff, those bytes stay inside a private repository.
    - name: Stage the handoff for a follow-up
      id: handoff
      if: always() && !cancelled() && inputs.auto-republish == 'true' && github.event.repository.private && steps.publish.outputs.deferred-comments != '' && steps.publish.outputs.deferred-comments != '0' && (steps.review.outputs.review-completed == 'true' || steps.republish.outputs.completion-file != '')
      shell: bash
      env:
        OUTPUT_DIR: ${{ steps.republish.outputs.output-dir || steps.review.outputs.output-dir }}
        REVIEW_COMPLETION_FILE: ${{ steps.republish.outputs.completion-file || steps.review.outputs.completion-file }}
      run: |
        env -i PATH="$PATH" python3 -I "$GITHUB_ACTION_PATH/scripts/contract.py" stage-artifact \
          --output-dir "$OUTPUT_DIR" --completion-file "$REVIEW_COMPLETION_FILE" \
          --stage-dir "$RUNNER_TEMP/korza-handoff-artifact" >> "$GITHUB_OUTPUT" \
          || echo "::warning::Could not stage the handoff; a follow-up will not be able to post deferred findings."

    - name: Upload the handoff for a follow-up
      id: upload-handoff
      if: always() && steps.handoff.outputs.artifact-dir != ''
      continue-on-error: true # the comments are already posted; a lost artifact is not fatal
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ai-review-handoff-pr${{ steps.prep.outputs.pr-number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.handoff.outputs.artifact-dir }}
        retention-days: 14
        if-no-files-found: ignore

    # Only once the handoff is actually uploaded: a follow-up that cannot download it would
    # spend a run to fail, and the findings would still be owed.
    - name: Post the rest without asking the author
      if: always() && !cancelled() && inputs.auto-republish == 'true' && github.event.repository.private && steps.publish.outputs.deferred-comments != '' && steps.publish.outputs.deferred-comments != '0' && steps.upload-handoff.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ steps.prep.outputs.pr-number }}
        DEFERRED: ${{ steps.publish.outputs.deferred-comments }}
        ATTEMPT: ${{ inputs.republish-attempt }}
        MAX_ATTEMPTS: ${{ inputs.max-republish-attempts }}
      run: bash "$GITHUB_ACTION_PATH/scripts/dispatch_republish.sh"

    - name: Complete check
      if: always() && steps.prep.outputs.check-run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CHECK_RUN_ID: ${{ steps.prep.outputs.check-run-id }}
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
        VERDICT: ${{ steps.review.outputs.verdict }}
        REVIEW_COMPLETED: ${{ steps.review.outputs.review-completed }}
        JOB_CANCELLED: ${{ job.status == 'cancelled' }}
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        DELIVERY: ${{ steps.publish.outputs.delivery }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        SUMMARY_FILE: ${{ steps.review.outputs.summary-file }}
        RESULT_FILE: ${{ steps.review.outputs.result-file }}
        BLOCKING_PROCESS_FAILURE: ${{ steps.review.outputs.blocking-process-failure }}
      run: bash "$GITHUB_ACTION_PATH/scripts/finalize.sh"

    - name: Log out of GHCR
      if: always() && steps.prep.outputs.run == 'true'
      shell: bash
      run: docker logout ghcr.io >/dev/null 2>&1 || true

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.review.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.review.outputs.sarif-file }}
        category: korza-ai-review

    # Snapshot regular debug files outside the engine mount before uploading.
    # Source and model text are not redacted.
    - name: Stage debug files
      id: debug
      if: always() && (inputs.upload-debug == 'true' || (inputs.upload-debug == 'auto' && github.event.repository.private)) && steps.review.outputs.output-dir != ''
      shell: bash
      env:
        OUTPUT_DIR: ${{ steps.review.outputs.output-dir }}
      run: env -i PATH="$PATH" OUTPUT_DIR="$OUTPUT_DIR" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" python3 -I "$GITHUB_ACTION_PATH/scripts/stage_debug.py"

    - name: Upload debug files
      if: always() && (inputs.upload-debug == 'true' || (inputs.upload-debug == 'auto' && github.event.repository.private)) && steps.review.outputs.output-dir != '' && steps.debug.outputs.debug-dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ai-review-pr${{ steps.prep.outputs.pr-number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.debug.outputs.debug-dir }}
        retention-days: 14
        if-no-files-found: ignore

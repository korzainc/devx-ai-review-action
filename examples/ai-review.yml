# Drop into the consuming repo at .github/workflows/ai-review.yml and merge it to
# the default branch. GitHub only runs issue_comment workflows from there.
name: AI Code Review

on:
  issue_comment:
    types: [created]
  pull_request:          # only for the one-time /review hint; reviews run on /review only
    types: [opened, ready_for_review]
    # Once a skill blocks merges, add synchronize and reopened here and let the review job run
    # on pull_request too, so the gate cannot be skipped.
  # The action dispatches this itself when GitHub's rate limit leaves findings unposted, so
  # the rest arrive without the author asking. These inputs are its own; do not run this by
  # hand. Remove this block only together with auto-republish: "false".
  workflow_dispatch:
    inputs:
      pr:
        type: string
        description: Pull request to post the deferred findings to.
        required: true
      source-run-id:
        type: string
        description: Run whose handoff artifact holds those findings.
        required: true
      source-run-attempt:
        type: string
        description: That run's attempt, which keys its artifact.
        required: true
      attempt:
        type: string
        description: Which follow-up this is, counting from 1.
        required: true

permissions:
  contents: read
  pull-requests: write   # review comments and the eyes reaction
  checks: write          # the pass/fail check on the PR head commit
  packages: read         # pull the engine image with GITHUB_TOKEN (korzainc repos)
  actions: write         # dispatch the follow-up, and read the earlier run's handoff artifact

jobs:
  # Tells the author how to ask for a review, once per PR.
  hint:
    # Once per PR, when it is ready for review: opened as non-draft, or a draft marked ready.
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action == 'opened' && !github.event.pull_request.draft) ||
       github.event.action == 'ready_for_review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment how to request a review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' \
            | grep -q 'devx-ai-review-hint'; then
            echo "Review hint already posted on #$PR."
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file - <<'MSG'
          <!-- devx-ai-review-hint -->
          💡 **DevX AI Review** is available on this PR. Comment `/review` to run it. Reviews run on demand only.

          <details>
          <summary>How it works</summary>

          - Findings are posted as inline comments on the changed lines, often with a suggested fix.
          - The result appears as the **AI Code Review** check on this PR.
          - Comment `/review` again after new commits to re-run it.
          - Only repository members and collaborators can trigger a review.

          </details>
          MSG

  review:
    # On demand only: a /review comment on a PR (reviews cost model tokens).
    # Check the command and association before concurrency can cancel another run.
    if: >-
      !cancelled() &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["/review", "/review\n", "/review\r\n"]'), github.event.comment.body) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association)) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: ai-review-${{ github.event.issue.number || inputs.pr }}
      # A new /review supersedes a running one. A follow-up never cancels a review: it waits,
      # and posts whatever that review leaves unposted.
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the action commit that pins engine 0.1.1.
      - uses: korzainc/devx-ai-review-action@ab02c64333b5afd4792784630de5170defb0e3c0
        with:
          # Set by the action's own dispatch, never by hand.
          republish-pr-number: ${{ inputs.pr }}
          republish-source-run-id: ${{ inputs.source-run-id }}
          republish-source-run-attempt: ${{ inputs.source-run-attempt }}
          republish-attempt: ${{ inputs.attempt }}
          # Picked in this order: the repo's OpenAI key, its Anthropic key, then the org-level key.
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          org-openai-api-key: ${{ secrets.KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY }}
          # Repos outside korzainc also need:
          # registry-token: ${{ secrets.KORZA_REGISTRY_TOKEN }}
          # registry-username: korza-registry-bot

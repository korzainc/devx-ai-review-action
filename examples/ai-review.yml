# Drop into the consuming repo at .github/workflows/ai-review.yml and merge it to
# the default branch. GitHub only runs issue_comment workflows from there.
name: AI Code Review

on:
  issue_comment:
    types: [created]
  pull_request:          # add once a skill blocks merges, so the gate cannot be skipped
    types: [opened, synchronize, reopened, ready_for_review]  # ready_for_review: the hint

permissions:
  contents: read
  pull-requests: write   # review comments and the eyes reaction
  checks: write          # the pass/fail check on the PR head commit
  packages: read         # pull the engine image with GITHUB_TOKEN (korzainc repos)

concurrency:
  group: ai-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Tells the author how to ask for a review, once per PR.
  hint:
    # Once per PR, when it is ready for review: opened as non-draft, or a draft marked ready.
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action == 'opened' && !github.event.pull_request.draft) ||
       github.event.action == 'ready_for_review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment how to request a review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
            "Comment \`/review\` on this PR for a DevX AI Review. It runs on demand only."

  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The v1 tag is the supported way to consume this action: it moves with
      # releases on purpose. Pin a digest-tagged release instead if your org
      # requires immutable refs.
      # Semgrep flags this tag as mutable. That is deliberate: v1 moves with
      # releases and is the supported way to consume this action.
      - uses: korzainc/devx-ai-review-action@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repos outside korzainc also need:
          # registry-token: ${{ secrets.KORZA_REGISTRY_TOKEN }}
          # registry-username: korza-registry-bot

# Merge to the default branch so GitHub can receive /review comments.
# Pinned to the action commit that pins engine 0.1.2.
name: AI Code Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read

jobs:
  review:
    uses: korzainc/devx-ai-review-action/.github/workflows/ai-review.yml@a9ee8cceabf487c168a1f769163a4805834fd5e9
    secrets:
      # Picked in this order: the repository's own OpenAI key, its own Anthropic key, then the
      # org-level OpenAI key (its own name, since a repo and an org secret can't be told apart).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY: ${{ secrets.KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY }}

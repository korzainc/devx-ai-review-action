# Shell linting and formatting. shfmt takes its style from .editorconfig, so a
# bare `shfmt -d .` here matches a bare `shfmt -d .` locally.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh stub-engine/*.sh
      - name: Wrapper lifecycle tests
        run: python3 -m unittest discover -s tests -v
      - name: shfmt
        uses: docker://mvdan/shfmt:v3.14.1@sha256:8c06884a35683d8763fba6c0d9484d11a61a96da65f8d497d6f625825a6043f2
        with:
          args: -d .

# TEMPORARY (DX-322): proves upload-sarif end to end with the real engine.
# Runs the action from this branch on pushes to PR #16. Remove before merge.
name: SARIF trial (DX-322, temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read
  security-events: write

jobs:
  review:
    if: github.head_ref == 'dx-322-sarif'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: review
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          check-name: AI Code Review (SARIF trial)
          upload-sarif: "true"
          # This repo can pull only the pre-release package; main's default
          # (devx-ai-review:0.1.0) is a new package it has no read access to yet.
          image: ghcr.io/korzainc/devx-ai-review-pre-release:0.1.0-rc4-3e85c99@sha256:761391be95a00508ef7fc1e255dd268f2e8372b80c9934770e784b8cf8f6f478
      - name: Report outputs
        if: always()
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          FINDINGS: ${{ steps.review.outputs.findings }}
          SARIF: ${{ steps.review.outputs.sarif-file }}
        run: |
          echo "verdict=$VERDICT findings=$FINDINGS sarif-file=$SARIF"
          if [ -n "$SARIF" ] && [ -f "$SARIF" ]; then
            jq '{results: (.runs[0].results | length), rules: [.runs[0].tool.driver.rules[].id]}' "$SARIF"
          fi

name: AI Code Review
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read
jobs:
  review:
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || contains(fromJSON('["/review", "/review\n", "/review\r\n"]'), github.event.comment.body)) }}
    # The commit that pins engine 0.1.0.
    uses: korzainc/devx-ai-review-action/.github/workflows/ai-review.yml@041a434f6e4d4bf33b393b9606ee0f8fc93662a9
    with:
      fail-on-error: 'true'
      job-timeout-minutes: 25
      concurrency-prefix: ai-review-dogfood
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY: ${{ secrets.KORZA_ORGWIDE_DEVX_AI_REVIEW_OPENAI_API_KEY }}

name: AI Code Review
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read
jobs:
  review:
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || contains(fromJSON('["/review", "/review\n", "/review\r\n"]'), github.event.comment.body)) }}
    uses: korzainc/devx-ai-review-action/.github/workflows/ai-review.yml@fd3a113efc7988149259024c0542eb0d04d9aa22
    with:
      fail-on-error: 'true'
      job-timeout-minutes: 25
      concurrency-prefix: ai-review-dogfood
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
